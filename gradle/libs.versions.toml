[versions]
agp = "8.7.3"
kotlin = "2.0.21"
detekt = "1.23.8"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
coreKtx = "1.15.0"
work = "2.10.0"
coroutines = "1.9.0"
okio = "3.9.1"
logbackAndroid = "3.0.0"
# Versions below mirror third_party/jadx (jadx 1.5.6) so the engine compiles against what upstream builds with.
gson = "2.14.0"
slf4j = "2.0.18"
jetbrainsAnnotations = "26.1.0"
guava = "33.6.0-android"
smali = "3.0.9"
raung = "0.1.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
logback-android = { module = "com.github.tony19:logback-android", version.ref = "logbackAndroid" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrainsAnnotations" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
smali-baksmali = { module = "com.android.tools.smali:smali-baksmali", version.ref = "smali" }
raung-disasm = { module = "io.github.skylot:raung-disasm", version.ref = "raung" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
