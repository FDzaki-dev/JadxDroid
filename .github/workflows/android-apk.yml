name: Android APK

# Artifact path 1 of 2: the app APK. Kept apart from the report workflow (android-ci.yml) on purpose:
# no lint, detekt or report here, so the APK never waits for them. Both workflows run in parallel on every push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Prepare
        run: |
          chmod +x gradlew
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_BASE64 secret kosong: release APK tidak ditandatangani."
          fi

      - name: Build debug + release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: apk-JadxDroid-${{ env.SHORT_SHA }}-run${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
