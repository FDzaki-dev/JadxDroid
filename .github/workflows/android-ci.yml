name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Prepare
        run: |
          chmod +x gradlew
          mkdir -p ci-logs
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Non-blocking validation: lintDebug + detekt (tool failure is reported as NOT VERIFIED, never as pass).
      - name: Android Lint
        id: lint
        continue-on-error: true
        run: ./gradlew lintDebug --continue 2>&1 | tee ci-logs/lint.log

      - name: Detekt
        id: detekt
        continue-on-error: true
        run: ./gradlew detekt --continue 2>&1 | tee ci-logs/detekt.log

      - name: Build debug APK
        id: debug
        continue-on-error: true
        run: ./gradlew assembleDebug 2>&1 | tee ci-logs/debug.log

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_BASE64 secret kosong: release APK tidak ditandatangani."
          fi

      - name: Build release APK
        id: release
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease 2>&1 | tee ci-logs/release.log

      - name: Collect report
        id: report
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          DETEKT_OUTCOME: ${{ steps.detekt.outcome }}
          DEBUG_OUTCOME: ${{ steps.debug.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        run: bash scripts/ci/collect-report.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.report.outputs.report_name || format('laporan-JadxDroid-{0}-run{1}', env.SHORT_SHA, github.run_number) }}
          path: laporan-*.txt
          retention-days: 7

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: apk-JadxDroid-${{ env.SHORT_SHA }}-run${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
          retention-days: 7
