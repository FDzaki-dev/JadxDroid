name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-android.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Uji coba tanpa publikasi, format X.Y.Z-android.N"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-android\.[0-9]+$ ]]; then
            echo "::error::Versi tidak valid: '$VERSION' (format X.Y.Z-android.N)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Require green Android CI for this commit
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          CONCLUSION="$(gh run list --workflow android-ci.yml --commit "$GITHUB_SHA" --status completed --json conclusion --jq '.[0].conclusion // empty')"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Android CI untuk commit $GITHUB_SHA belum selesai atau tidak sukses (hasil: '${CONCLUSION:-tidak ada}'). Tunggu CI hijau, lalu tag ulang."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v h="## $VERSION" '
            $0 == h || index($0, h " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md tidak punya bagian '## $VERSION'. Tambahkan dulu, lalu tag ulang."
            exit 1
          fi
          {
            echo
            echo "---"
            echo "Android 12+ (API 31+). Verifikasi unduhan: \`sha256sum -c SHA256SUMS.txt\`."
            echo "File mapping dipakai untuk membaca stack trace rilis."
          } >> release-notes.md

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Quality gate (detekt, NewApi)
        run: |
          chmod +x gradlew
          ./gradlew detekt
          ./gradlew lintDebug
          if grep -E ': Error: .*\[NewApi\]' app/build/reports/lint/lint-results.txt; then
            echo "::error::Ada panggilan API di atas minSdk 31 (NewApi). Rilis dibatalkan."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name kosong. Jalankan Box B (GitHub Secrets) dulu."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreleaseVersion="$VERSION"

      - name: Verify signature and version, stage assets
        run: |
          mapfile -t APKS < <(find app/build/outputs/apk/release -name '*.apk')
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Harus tepat satu APK release, ditemukan ${#APKS[@]}"
            exit 1
          fi
          APK="${APKS[0]}"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          if [ ! -x "$APKSIGNER" ] || [ ! -x "$AAPT2" ]; then
            echo "::error::apksigner/aapt2 tidak ditemukan di build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK"
          BADGING="$("$AAPT2" dump badging "$APK")"
          IFS='.-' read -r MAJOR MINOR PATCH _ BUILD <<< "$VERSION"
          EXPECTED_CODE=$(( (MAJOR * 10000 + MINOR * 100 + PATCH) * 100 + BUILD ))
          grep -q "versionName='$VERSION'" <<< "$BADGING" || { echo "::error::versionName APK != $VERSION"; exit 1; }
          grep -q "versionCode='$EXPECTED_CODE'" <<< "$BADGING" || { echo "::error::versionCode APK != $EXPECTED_CODE"; exit 1; }
          mkdir -p dist
          cp "$APK" "dist/JadxDroid-$VERSION.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/JadxDroid-$VERSION-mapping.txt"
          (cd dist && sha256sum "JadxDroid-$VERSION.apk" "JadxDroid-$VERSION-mapping.txt" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        continue-on-error: true
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/JadxDroid-*.apk

      - name: Publish GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "JadxDroid $VERSION" --notes-file release-notes.md
          fi

      - name: Upload dist (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: release-dry-run
          path: dist/
          retention-days: 7
